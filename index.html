<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiesta de la Luz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --noche: #000000;
    --tinta: #f6f1e7;
    --tenue: rgba(246, 241, 231, 0.62);
    --hilo: rgba(246, 241, 231, 0.28);
    --vela: #ffd28a;
    --brasa: #ff9f45;
    --gutter: clamp(16px, 3.6vw, 52px);
    --display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
    --ui: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  }
  html, body { background: var(--noche); }
  body {
    margin: 0;
    overflow: hidden;
    color: var(--tinta);
    font-family: var(--ui);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }
  #escenario {
    position: fixed; inset: 0; background: var(--noche);
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #escenario canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #luz { mix-blend-mode: screen; } /* el negro de las luces deja ver el mapa */
  #escenario.sin-cursor { cursor: none; }

  .capa {
    position: absolute;
    left: calc(var(--gutter) + env(safe-area-inset-left, 0px));
    right: calc(var(--gutter) + env(safe-area-inset-right, 0px));
    pointer-events: none;
  }

  /* Portada */
  #portada {
    bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px) + 8px);
    transition: opacity .9s ease, transform .9s ease;
  }
  #portada.oculto { opacity: 0; transform: translateY(12px); }
  #portada .frase {
    margin: 0;
    font-family: var(--display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(18px, min(4.1vw, 7.5vh), 74px);
    line-height: 1.12;
    letter-spacing: -.005em;
    white-space: pre-line;   /* respeta el salto de línea de la frase */
    color: var(--tinta);
    text-shadow: 0 0 40px rgba(255, 190, 110, .32), 0 0 18px #000;
  }
  .antetitulo {
    margin: 0 0 .4rem;
    font-size: clamp(12px, 1.15vw, 15px);
    font-weight: 400;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--vela);
  }

  /* Marca persistente */
  #marca {
    top: calc(var(--gutter) + env(safe-area-inset-top, 0px) - 4px);
    font-family: var(--display);
    font-style: italic;
    font-size: clamp(20px, 2vw, 28px);
    color: var(--tinta);
    transition: opacity .8s ease;
  }
  #marca small {
    display: block;
    margin-top: 2px;
    font: 400 11px/1.2 var(--ui);
    font-style: normal;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--vela);
  }

  /* Rótulo inferior */
  #rotulo {
    bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem 2rem;
    transition: opacity .8s ease;
  }
  #rotulo .escena { min-width: 0; transition: opacity .6s ease, transform .6s ease; }
  #rotulo .escena.cambiando { opacity: 0; transform: translateY(8px); }
  #rotulo h2 {
    margin: 0;
    font-family: var(--display);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(26px, min(5.4vw, 8.5vh), 84px);
    line-height: .95;
    text-wrap: balance;
  }
  #rotulo .sub {
    margin: .45rem 0 0;
    font-size: clamp(14px, 1.35vw, 19px);
    letter-spacing: .03em;
    color: var(--tenue);
  }
  #rotulo .fuente {
    margin: .5rem 0 0;
    font-size: 11.5px;
    letter-spacing: .08em;
    color: rgba(246, 241, 231, .42);
  }
  #rotulo .fuente:empty { display: none; }
  .contadores { display: flex; gap: clamp(1.2rem, 3vw, 2.8rem); }
  .contador { text-align: right; }
  .contador b {
    display: block;
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(26px, min(4.2vw, 7vh), 64px);
    line-height: 1;
    font-variant-numeric: tabular-nums lining-nums;
    color: var(--vela);
    text-shadow: 0 0 22px rgba(255, 170, 80, .45);
  }
  .contador span {
    font-size: 11.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--tenue);
  }

  /* Cierre */
  #cierre {
    top: 50%;
    transform: translateY(-62%);
    text-align: center;
    transition: opacity 1.6s ease;
  }
  #cierre blockquote {
    margin: 0 auto;
    max-width: 18ch;
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(30px, min(6.6vw, 10vh), 104px);
    line-height: 1.02;
    text-wrap: balance;
    text-shadow: 0 0 30px #000, 0 0 60px #000, 0 0 50px rgba(255, 180, 90, .35);
  }
  #cierre cite {
    display: block;
    margin-top: 1.1rem;
    font: 400 clamp(12px, 1.2vw, 15px)/1 var(--ui);
    font-style: normal;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--vela);
    text-shadow: 0 0 14px #000;
  }

  /* Controles */
  #controles {
    left: auto;
    top: calc(var(--gutter) + env(safe-area-inset-top, 0px) - 8px);
    display: flex;
    gap: 4px;
    padding: 4px;
    border: 1px solid rgba(246, 241, 231, .14);
    border-radius: 999px;
    background: rgba(0, 0, 0, .55);
    pointer-events: auto;
    transition: opacity .5s ease;
  }
  #controles button {
    display: grid;
    place-items: center;
    width: 38px; height: 38px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--tenue);
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  #controles button:hover { background: rgba(246, 241, 231, .1); color: var(--tinta); }
  #controles button:focus-visible { outline: 1.5px solid var(--vela); outline-offset: 1px; color: var(--tinta); }
  #controles svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #controles .lleno { fill: currentColor; stroke: none; }

  /* Foto final de la iglesia */
  #foto {
    position: absolute; inset: 0;
    background: #000;
    overflow: hidden;
    opacity: 0; visibility: hidden;
    transition: opacity 1.6s ease, visibility 0s linear 1.6s;
  }
  #foto.visible { opacity: 1; visibility: visible; transition: opacity 1.6s ease; }
  #foto img { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 50% 55%; }
  #foto video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  #foto.con-video img, #foto.con-video .foto-vacia { display: none !important; }
  #foto.visible img { animation: acercar 18s ease-out forwards; }
  @keyframes acercar { from { transform: scale(1); } to { transform: scale(1.1); } }
  #foto::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(0, 0, 0, .88) 0%, rgba(0, 0, 0, .45) 38%, rgba(0, 0, 0, 0) 65%);
  }
  .foto-vacia {
    display: none;
    position: absolute;
    inset: 10% 10% auto;
    height: 42%;
    place-items: center;
    align-content: center;
    gap: .5rem;
    border: 1.5px dashed rgba(255, 210, 138, .45);
    border-radius: 14px;
    color: var(--tenue);
    text-align: center;
    padding: 1rem;
  }
  .foto-vacia strong { font: italic 500 clamp(22px, 3vw, 36px)/1.1 var(--display); color: var(--tinta); }
  .foto-vacia small { font-size: 13px; letter-spacing: .04em; }
  #foto.sin-foto img { display: none; }
  #foto.sin-foto .foto-vacia { display: grid; }
  .foto-texto {
    position: absolute; z-index: 1;
    left: calc(var(--gutter) + env(safe-area-inset-left, 0px));
    right: calc(var(--gutter) + env(safe-area-inset-right, 0px));
    bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: .8rem 2rem;
  }
  /* versículo abajo a la derecha, alineado con el nombre de la iglesia */
  .foto-versiculo { margin-left: auto; text-align: right; max-width: min(38ch, 100%); }
  .foto-versiculo blockquote { text-wrap: balance; }
  .foto-texto h2 {
    margin: 0;
    font: italic 500 clamp(40px, min(8vw, 12vh), 120px)/.95 var(--display);
    text-shadow: 0 0 40px rgba(255, 190, 110, .35);
  }
  .foto-texto blockquote {
    margin: 0;
    font: italic 400 clamp(20px, min(2.6vw, 4.2vh), 34px)/1.2 var(--display);
    color: var(--tinta);
  }
  .foto-texto cite {
    display: block; margin-top: .45rem;
    font: 400 12px/1 var(--ui); font-style: normal;
    letter-spacing: .26em; text-transform: uppercase; color: var(--vela);
  }

  #controles button[aria-pressed="true"] { color: var(--vela); background: rgba(255, 210, 138, .14); }
  #aviso {
    position: absolute; left: 50%; top: calc(var(--gutter) + env(safe-area-inset-top, 0px));
    transform: translateX(-50%);
    margin: 0; padding: .55rem 1rem;
    border: 1px solid rgba(255, 210, 138, .35); border-radius: 999px;
    background: rgba(0, 0, 0, .7);
    font-size: 13px; letter-spacing: .04em; color: var(--tinta);
    pointer-events: none; white-space: nowrap;
    transition: opacity .4s ease;
  }

  /* Sin controles ni textos fijos en pantalla: todo se maneja con comandos (ver COMANDOS.txt) */
  /* TEMPORAL para probar en el celular: los controles se ven. Para ocultarlos de nuevo, agregar #controles acá abajo */
  #marca, #aviso { display: none !important; }

  [hidden] { display: none !important; }
  .oculto { opacity: 0 !important; }
  #controles.oculto { pointer-events: none; }

  @media (max-height: 500px) {
    #rotulo { gap: .5rem 1.5rem; }
    #rotulo .sub { margin-top: .2rem; }
  }
  @media (max-width: 640px) {
    #marca { display: none; }
    #rotulo { justify-content: flex-start; gap: .6rem 1.5rem; }
    .contador { text-align: left; }
    #controles button { width: 34px; height: 34px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .01s !important; }
  }
</style>

<div id="escenario">
  <canvas id="base" aria-hidden="true"></canvas>
  <canvas id="luz" role="img" aria-label="Mapa del mundo en negro con bordes blancos; se encienden luces en las ciudades donde se celebra la Fiesta de la Luz."></canvas>

  <section id="foto" aria-live="polite">
    <img id="foto-img" alt="Entrada de la Iglesia Rajem" decoding="async">
    <video id="foto-video" playsinline preload="auto" hidden></video>
    <div class="foto-vacia"><strong>Foto de la entrada de Rajem</strong><small>Guardala en la carpeta <b>fotos</b> con el nombre <b>rajem-entrada.jpg</b></small></div>
    <div class="foto-texto">
      <div class="foto-nombre">
        <p class="antetitulo" id="f-direccion"></p>

      </div>
      <div class="foto-versiculo">
        <blockquote id="f-texto"></blockquote>
        <cite id="f-cita"></cite>
      </div>
    </div>
  </section>

  <div id="marca" class="capa oculto">

  <nav id="controles" class="capa" aria-label="Controles de la presentación">
    <button id="b-ant" type="button" aria-label="Escena anterior (←)" title="Escena anterior (←)">

    <button id="b-play" type="button" aria-label="Reproducir (Espacio)" title="Reproducir / pausar (Espacio)">
      <svg viewBox="0 0 24 24" class="i-play"><path class="lleno" d="M8 5.5v13l10.5-6.5z"/></svg>
      <svg viewBox="0 0 24 24" class="i-pausa" hidden><rect class="lleno" x="6.5" y="5.5" width="3.6" height="13" rx="1"/><rect class="lleno" x="13.9" y="5.5" width="3.6" height="13" rx="1"/></svg>
    </button>
    <button id="b-sig" type="button" aria-label="Escena siguiente (→)" title="Escena siguiente (→)">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button id="b-reiniciar" type="button" aria-label="Volver al inicio (R)" title="Volver al inicio (R)">
      <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4"/><path d="M4.5 4.5v4h4"/></svg>
    </button>
    <button id="b-proyector" type="button" aria-pressed="false" aria-label="Modo proyector (P)" title="Modo proyector: líneas más gruesas y luces más intensas (P)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/></svg>
    </button>
    <button id="b-pantalla" type="button" aria-label="Pantalla completa (F)" title="Pantalla completa (F)">
      <svg viewBox="0 0 24 24"><path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15"/></svg>
    </button>
  </nav>
  <p id="aviso" class="oculto" role="status"></p>

  <section id="portada" class="capa">
    <p class="frase" data-t="bajada"></p>
  </section>

  <section id="rotulo" class="capa oculto" aria-live="polite">
    <div class="escena">
      <h2 id="r-titulo"></h2>
      <p class="sub" id="r-sub"></p>
      <p class="fuente" id="r-fuente"></p>

    <div class="contadores">
      <div class="contador"><b id="n-luces">0</b><span>ciudades</span></div>
      <div class="contador"><b id="n-paises">0</b><span>países</span></div>

  </section>

  <section id="cierre" class="capa oculto" aria-live="polite">
    <blockquote id="c-texto"></blockquote>
    <cite id="c-cita"></cite>
  </section>
</div>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="lib/mapa.js"></script>
<script src="lib/rajem.js"></script>
<script src="lugares.js"></script>
<script>
(function () {
  "use strict";
  const P = window.PRESENTACION;
  const topo = window.MAPA;
  const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);

  // Textos configurables
  document.querySelectorAll("[data-t]").forEach((el) => {
    const v = P[el.dataset.t];
    if (v) el.textContent = v;
  });

  const escenario = $("escenario");
  const base = $("base"), luz = $("luz");
  const bctx = base.getContext("2d"), lctx = luz.getContext("2d");

  const capas = {
    provincias: topojson.feature(topo, topo.objects.provinces),
    paises: topojson.feature(topo, topo.objects.borders),
    continentes: topojson.feature(topo, topo.objects.land)
  };

  // Calles, vías y partidos alrededor de la iglesia, para el acercamiento final.
  // Se dibujan relativos a la iglesia (×LOCAL) para no perder precisión con zoom extremo.
  const ig = P.iglesia;
  const geoLocal = window.RAJEM_GEO;
  const local = ig && geoLocal ? {
    partidos: topojson.feature(geoLocal, geoLocal.objects.partidos),
    avenidas: topojson.feature(geoLocal, geoLocal.objects.avenidas),
    calles: topojson.feature(geoLocal, geoLocal.objects.calles),
    vias: topojson.feature(geoLocal, geoLocal.objects.vias)
  } : null;
  const LOCAL = 1e4;
  let origen = [0, 0], pxKm = 1, trazosLocales = {};
  // 0 → 1 a medida que el ancho visible baja de "desde" a "hasta" km
  const aparece = (km, desde, hasta) => Math.max(0, Math.min(1, (desde - km) / (desde - hasta)));

  const escenas = P.escenas;
  const lugares = [];
  escenas.forEach((e, i) => (e.lugares || []).forEach((l) => {
    lugares.push(Object.assign({
      escena: i,
      pais: l.pais || e.pais || l.zona || l.nombre,
      f: 0.7 + Math.random() * 0.6,
      fase: Math.random() * Math.PI * 2,
      t: null
    }, l));
  }));

  // Brillo pre-renderizado
  // Brillos pre-renderizados sobre negro opaco: al combinarlos con "lighten"
  // se queda el más brillante y las luces cercanas no se suman en una mancha.
  function sprite(intensidad) {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const g = c.getContext("2d");
    g.fillStyle = "#000";
    g.fillRect(0, 0, 128, 128);
    g.globalAlpha = intensidad;
    const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, "rgba(255,252,240,1)");
    r.addColorStop(0.07, "rgba(255,240,205,0.95)");
    r.addColorStop(0.2, "rgba(255,200,120,0.5)");
    r.addColorStop(0.45, "rgba(255,150,60,0.14)");
    r.addColorStop(1, "rgba(255,120,30,0)");
    g.fillStyle = r;
    g.fillRect(0, 0, 128, 128);
    return c;
  }
  const brillo = sprite(1), halo = sprite(0.16), haloFuerte = sprite(0.28);

  // Modo proyector: líneas más gruesas y luces más intensas para proyectores que lavan los negros
  let proyector = /proyector/.test(location.hash);
  try { if (localStorage.getItem("fdl-proyector") === "1") proyector = true; } catch (e) { /* sin almacenamiento */ }
  const pr = (normal, fuerte) => (proyector ? fuerte : normal);

  let W, H, dpr, proj, trazos = {};
  let cam = [0, 0, 1];          // centro x, centro y, ancho visible (en px de proyección base)
  let vuelo = null, regreso = false;
  let baseSucia = true, camPrevia = "";

  // Reloj de la presentación (se detiene en pausa)
  let reloj = 0, ultimo = performance.now(), reproduciendo = false;
  let escena = -1, fase = "portada", indice = 0, proximo = 0, etapa = 0, tDestello = 0;
  const inicioMapa = performance.now();

  function vistaDe(v) {
    const [o, s, e, n] = v;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const suma = (lon, lat) => {
      const p = proj([lon, lat]);
      if (!p) return;
      x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]);
      y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
    };
    for (let i = 0; i <= 24; i++) {
      const lon = o + (e - o) * i / 24, lat = s + (n - s) * i / 24;
      suma(lon, s); suma(lon, n); suma(o, lat); suma(e, lat);
    }
    // alto libre por encima del rótulo inferior (cambia en celulares y pantallas bajas)
    const techo = $("rotulo").getBoundingClientRect().top - 10;
    const libre = Math.max(H * 0.5, Math.min(H * 0.94, techo));
    const w = Math.max(x1 - x0, (y1 - y0) * W / libre) * 1.06;
    const k = W / w;
    return [(x0 + x1) / 2, (y0 + y1) / 2 + (H - libre) / 2 / k, w];
  }

  // Recuadro de "km" de ancho centrado en la iglesia
  function vistaKm(km) {
    const dlon = km / 2 / (111.32 * Math.cos(ig.lat * Math.PI / 180));
    const dlat = km / 2 / 110.57 * 0.55;
    return [ig.lon - dlon, ig.lat - dlat, ig.lon + dlon, ig.lat + dlat];
  }

  function vistaActual() {
    if (escena < 0) return [-165, -48, 180, 72];
    const e = escenas[escena];
    if (e.acercamiento) return vistaKm(e.etapas[Math.min(etapa, e.etapas.length - 1)].km);
    return e.vista;
  }

  function redimensionar() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    for (const c of [base, luz]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    proj = d3.geoNaturalEarth1().fitSize([W, H], { type: "Sphere" });
    const ruta = d3.geoPath(proj);
    for (const k in capas) trazos[k] = new Path2D(ruta(capas[k]));
    lugares.forEach((l) => { l.p = proj([l.lon, l.lat]); });
    if (ig) {
      origen = proj([ig.lon, ig.lat]);
      const este = proj([ig.lon + 0.05, ig.lat]);
      pxKm = Math.abs(este[0] - origen[0]) / (0.05 * 111.32 * Math.cos(ig.lat * Math.PI / 180));
    }
    if (local) {
      const relativa = d3.geoTransform({
        point(x, y) { const q = proj([x, y]); this.stream.point((q[0] - origen[0]) * LOCAL, (q[1] - origen[1]) * LOCAL); }
      });
      const rl = d3.geoPath(relativa);
      for (const k in local) trazosLocales[k] = new Path2D(rl(local[k]));
    }
    vuelo = null;
    cam = vistaDe(vistaActual());
    baseSucia = true;
  }

  function volar(destino, lento) {
    const desde = cam.slice();
    const interp = d3.interpolateZoom(desde, destino);
    const dur = reducir ? 0.01 : lento
      ? Math.min(4.5, Math.max(2.4, interp.duration / 1000 * 0.9))
      : Math.min(4.2, Math.max(1.6, interp.duration / 1000 * 0.85));
    vuelo = { interp, t0: reloj, dur };
  }

  function dibujarBase(ahora) {
    const intro = reducir ? 1 : Math.min(1, (ahora - inicioMapa) / 2200);
    const clave = cam.join(",") + "|" + intro;
    if (!baseSucia && clave === camPrevia) return;
    camPrevia = clave; baseSucia = false;

    const k = W / cam[2];
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    bctx.fillStyle = "#000";
    bctx.fillRect(0, 0, base.width, base.height);
    bctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * (W / 2 - cam[0] * k), dpr * (H / 2 - cam[1] * k));
    bctx.lineJoin = "round";
    bctx.lineCap = "round";
    bctx.strokeStyle = "#fff";
    const kmVisible = cam[2] / pxKm;
    const e = (1 - Math.pow(1 - intro, 3)) * (1 - aparece(kmVisible, 14, 5)); // el mundo se apaga muy cerca
    const zoom = Math.log2(Math.max(1, k));
    if (e > 0) {

    bctx.globalAlpha = e * pr(Math.min(0.42, 0.15 + 0.075 * zoom), Math.min(0.75, 0.34 + 0.09 * zoom));
    bctx.lineWidth = pr(0.5, 1.1) / k;
    bctx.stroke(trazos.provincias);

    bctx.globalAlpha = e * pr(0.58, 0.9);
    bctx.lineWidth = pr(0.8, 1.7) / k;
    bctx.stroke(trazos.paises);

    bctx.globalAlpha = e * pr(0.95, 1);
    bctx.lineWidth = pr(1.15, 2.3) / k;
    bctx.stroke(trazos.continentes);
    }

    // Barrio de la iglesia: partidos, avenidas, vías y calles según la cercanía
    if (local && kmVisible < 400) {
      const kl = k / LOCAL;
      bctx.setTransform(dpr * kl, 0, 0, dpr * kl, dpr * (W / 2 + (origen[0] - cam[0]) * k), dpr * (H / 2 + (origen[1] - cam[1]) * k));
      const linea = (capa, alfa, ancho, guiones) => {
        if (alfa <= 0) return;
        bctx.globalAlpha = Math.min(1, alfa * pr(1, 1.6));
        bctx.lineWidth = ancho * pr(1, 1.9) / kl;
        bctx.setLineDash(guiones ? guiones.map((g) => g / kl) : []);
        bctx.stroke(trazosLocales[capa]);
      };
      linea("partidos", 0.55 * aparece(kmVisible, 300, 120), 1);
      linea("avenidas", 0.9 * aparece(kmVisible, 11, 4.5), 1.3);
      linea("vias", 0.6 * aparece(kmVisible, 10, 4), 1, [5, 4]);
      linea("calles", 0.42 * aparece(kmVisible, 6, 2.5), 0.7);
      bctx.setLineDash([]);
    }
    bctx.globalAlpha = 1;
  }

  function dibujarLuces(ahora) {
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lctx.globalCompositeOperation = "source-over";
    lctx.fillStyle = "#000";
    lctx.fillRect(0, 0, W, H);
    const k = W / cam[2];
    const ox = W / 2 - cam[0] * k, oy = H / 2 - cam[1] * k;
    const escala = Math.min(1.7, 0.85 + 0.2 * Math.log2(k + 1)) * Math.min(1, Math.max(0.6, W / 1400)) * pr(1, 1.3);
    const final = escena >= 0 && escenas[escena].final && fase !== "vuelo";
    const respiro = final ? 1 + 0.14 * Math.sin(ahora / 900) : 1;
    const s = ahora / 1000;

    lctx.globalCompositeOperation = "lighter";
    const encendidas = [];
    let faro = null;
    const total = lugares.reduce((n, l) => n + (l.t !== null ? 1 : 0), 0);
    const densidad = Math.min(1, 40 / Math.max(1, total)); // con muchas luces se suaviza el brillo
    for (const l of lugares) {
      if (l.t === null) continue;
      const x = l.p[0] * k + ox, y = l.p[1] * k + oy;
      if (x < -200 || y < -200 || x > W + 200 || y > H + 200) continue;
      const edad = reloj - l.t;
      const parpadeo = 1 + 0.07 * Math.sin(s * 3.1 * l.f + l.fase) + 0.04 * Math.sin(s * 11.7 * l.f + l.fase * 2);
      const destello = reducir || edad > 0.9 ? 0 : 1.7 * Math.pow(1 - edad / 0.9, 2);

      // halo y núcleo: donde se superponen manda el más brillante (no se suman)
      lctx.globalCompositeOperation = "lighten";
      lctx.globalAlpha = 1;
      const rh = 90 * escala * respiro;
      lctx.drawImage(pr(halo, haloFuerte), x - rh, y - rh, rh * 2, rh * 2);

      // núcleo
      lctx.globalAlpha = 1;
      const r = 16 * escala * (l.destacado ? 1.7 : 0.6 + 0.4 * densidad) * parpadeo * respiro * (1 + destello);
      lctx.drawImage(brillo, x - r, y - r, r * 2, r * 2);

      // onda de encendido
      lctx.globalCompositeOperation = "lighter";
      if (!reducir && edad < 1.4) {
        lctx.globalAlpha = 0.55 * (0.35 + 0.65 * densidad) * (1 - edad / 1.4);
        lctx.strokeStyle = "rgb(255,214,150)";
        lctx.lineWidth = 1.4;
        lctx.beginPath();
        lctx.arc(x, y, 4 + edad * 70 * escala, 0, Math.PI * 2);
        lctx.stroke();
      }
      if (l.destacado) {
        // faro: ondas que salen cada 1,8 s
        lctx.globalCompositeOperation = "lighter";
        for (let j = 0; j < 2; j++) {
          const f = ((s + j * 0.9) % 1.8) / 1.8;
          lctx.globalAlpha = 0.7 * (1 - f);
          lctx.strokeStyle = "rgb(255,214,150)";
          lctx.lineWidth = 1.6;
          lctx.beginPath();
          lctx.arc(x, y, 8 + f * 80 * escala, 0, Math.PI * 2);
          lctx.stroke();
        }
        faro = { l, x, y, edad };
      } else if (edad < 2.2 && l.etiqueta) encendidas.push({ l, x, y, edad });
    }

    // nombres de los lugares recién encendidos
    lctx.globalCompositeOperation = "source-over";
    const tam = tamEtiqueta();
    lctx.font = `${pr(400, 500)} ${tam}px Jost, "Century Gothic", system-ui, sans-serif`;
    lctx.textBaseline = "middle";
    lctx.shadowColor = "rgba(0,0,0,0.95)";
    lctx.shadowBlur = 6;
    for (const { l, x, y, edad } of encendidas) {
      const a = edad < 0.25 ? edad / 0.25 : edad > 1.4 ? Math.max(0, 1 - (edad - 1.4) / 0.8) : 1;
      lctx.globalAlpha = a;
      const texto = l.nombre;
      const ancho = lctx.measureText(texto).width;
      const izq = x + 14 + ancho > W - 16;
      lctx.fillStyle = "#fbf3e2";
      lctx.textAlign = izq ? "right" : "left";
      lctx.fillText(texto, izq ? x - 14 : x + 14, y);
    }
    // nombre de la iglesia, siempre visible
    if (faro) {
      lctx.globalAlpha = Math.min(1, faro.edad / 0.4);
      lctx.font = `italic 500 ${Math.round(tam * 1.9)}px "Cormorant Garamond", Georgia, serif`;
      lctx.fillStyle = "#ffd28a";
      lctx.textAlign = "left";
      // contorno oscuro para que se lea sobre las calles
      lctx.lineJoin = "round";
      lctx.lineWidth = 5;
      lctx.strokeStyle = "rgba(0,0,0,0.88)";
      lctx.strokeText(faro.l.nombre, faro.x + 22, faro.y);
      lctx.fillText(faro.l.nombre, faro.x + 22, faro.y);
    }
    lctx.shadowBlur = 0;
    lctx.globalAlpha = 1;

    // destello que abre paso a la foto
    if (faro && (fase === "destello" || fase === "fin") && escenas[escena].acercamiento) {
      const pr = Math.min(1, (reloj - tDestello) / 1.6);
      const rad = Math.hypot(W, H) * 1.2 * pr * pr + 1;
      const g = lctx.createRadialGradient(faro.x, faro.y, 0, faro.x, faro.y, rad);
      g.addColorStop(0, "rgba(255,250,235,1)");
      g.addColorStop(0.5, "rgba(255,226,170," + (0.6 + 0.4 * pr) + ")");
      g.addColorStop(1, "rgba(255,190,110,0)");
      lctx.globalCompositeOperation = "lighter";
      lctx.globalAlpha = 1;
      lctx.fillStyle = g;
      lctx.fillRect(0, 0, W, H);
      lctx.globalCompositeOperation = "source-over";
    }
  }

  const tamEtiqueta = () => Math.round(Math.max(12, Math.min(15, W / 110)) * pr(1, 1.2));

  // Al encenderse, una ciudad muestra su nombre solo si no se pisa con otro visible
  function decidirEtiqueta(l) {
    l.etiqueta = false;
    if (!l.nombre || l.destacado) return;
    const k = W / cam[2];
    const x = l.p[0] * k + W / 2 - cam[0] * k, y = l.p[1] * k + H / 2 - cam[1] * k;
    const tam = tamEtiqueta();
    const w = l.nombre.length * tam * 0.56 + 10, h = tam + 8;
    const izq = x + 14 + w > W - 16;
    const caja = { x0: izq ? x - 14 - w : x + 14, x1: izq ? x - 14 : x + 14 + w, y0: y - h / 2, y1: y + h / 2 };
    for (const o of lugares) {
      if (o === l || !o.etiqueta || o.t === null || reloj - o.t >= 2.2) continue;
      const c = o.caja;
      if (!(caja.x1 < c.x0 || caja.x0 > c.x1 || caja.y1 < c.y0 || caja.y0 > c.y1)) return;
    }
    l.caja = caja;
    l.etiqueta = true;
  }

  // ── Rótulos ───────────────────────────────────────────────
  function actualizarContadores() {
    const on = lugares.filter((l) => l.t !== null && !l.destacado); // la iglesia no cuenta como ciudad
    $("n-luces").textContent = on.length;
    $("n-paises").textContent = new Set(on.map((l) => l.pais)).size;
  }

  function mostrarRotulo(titulo, sub, fuente) {
    const caja = document.querySelector("#rotulo .escena");
    caja.classList.add("cambiando");
    setTimeout(() => {
      $("r-titulo").textContent = titulo || "";
      $("r-sub").textContent = sub || "";
      $("r-fuente").textContent = fuente || "";
      caja.classList.remove("cambiando");
    }, reducir ? 0 : 450);
  }
  function mostrarEscena(i) {
    const e = escenas[i];
    if (e.acercamiento) mostrarRotulo(e.etapas[etapa].titulo, e.etapas[etapa].subtitulo, e.fuente);
    else mostrarRotulo(e.titulo, e.subtitulo, e.fuente);
  }

  // Foto de la entrada (si todavía no está, se ve un recuadro que lo indica)
  // Video final (si está configurado, va en lugar de la foto; si no carga, se muestra la foto)
  const video = $("foto-video");
  let conVideo = false;
  if (ig && ig.video) {
    conVideo = true;
    video.hidden = false;
    $("foto").classList.add("con-video");
    video.onerror = () => {
      conVideo = false;
      video.hidden = true;
      $("foto").classList.remove("con-video");
    };
    video.src = ig.video;
  }
  function reproducirVideo() {
    if (!conVideo) return;
    video.currentTime = 0;
    video.muted = silencio;
    const r = video.play();
    // si el navegador no deja arrancar con sonido, arranca sin sonido
    if (r && r.catch) r.catch(() => { video.muted = true; video.play().catch(() => {}); });
  }

  // ── Narración y música ─────────────────────────────────────
  // Cada escena tiene su parte de la voz; la escena no avanza hasta que la voz termina.
  // La música baja mientras habla la voz y se apaga despacio cuando termina el video.
  const A = P.audio || {};
  let musica = A.musica ? new Audio(A.musica) : null;
  const voz = new Audio();
  const VOL = A.volumenMusica ?? 0.55, VOL_CON_VOZ = A.volumenMusicaConVoz ?? 0.2;
  let hablando = false, finVoz = -1e9, silencio = false, musicaFinal = false, volBase = VOL;
  if (musica) { musica.preload = "auto"; musica.volume = 0; musica.loop = true; }   // se repite hasta que termina el video
  voz.preload = "auto";

  function fundir(el, destino, ms) {
    if (!el) return;
    clearInterval(el._fundido);
    const inicio = el.volume, t0 = performance.now();
    el._fundido = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / ms);
      el.volume = Math.max(0, Math.min(1, inicio + (destino - inicio) * k));
      if (k >= 1) clearInterval(el._fundido);
    }, 40);
  }
  function terminarVoz() {
    if (!hablando) return;
    hablando = false;
    finVoz = reloj;
    fundir(musica, musicaFinal ? 0 : volBase, 900);
    if (conVideo) video.volume = 1;
  }
  let cola = [], esperaCola = null;   // partes que suenan una detrás de otra (p. ej. versículo y cita)
  function callar() {
    cola = [];
    clearTimeout(esperaCola);
    if (!voz.paused) voz.pause();
    terminarVoz();
  }
  // src puede ser un archivo o una lista de archivos que suenan seguidos, con una pausa breve entre cada uno
  function narrar(src) {
    callar();
    if (Array.isArray(src)) { cola = src.slice(1); src = src[0]; }
    if (!src) return;
    voz.src = src;
    voz.muted = silencio;
    hablando = true;
    fundir(musica, VOL_CON_VOZ, 500);
    if (conVideo && !video.paused) video.volume = 0.35;
    const r = voz.play();
    if (r && r.catch) r.catch(() => terminarVoz());   // si no se puede reproducir, la presentación sigue igual
  }
  voz.addEventListener("ended", () => {
    if (!cola.length) return terminarVoz();
    const seguir = () => {                   // sigue hablando: la música queda baja durante la pausa
      if (audioPausado) { esperaCola = setTimeout(seguir, 300); return; }   // si se pausó, espera
      voz.src = cola.shift();
      voz.play().catch(() => terminarVoz());
    };
    esperaCola = setTimeout(seguir, (A.pausaEntrePartes ?? 0.8) * 1000);
  });
  voz.addEventListener("error", () => { if (voz.getAttribute("src")) terminarVoz(); });
  const vozLibre = () => !hablando && reloj >= finVoz + 0.4;

  function arrancarMusica() {
    if (!musica) return;
    musicaFinal = false;
    volBase = VOL;
    musica.currentTime = 0;
    musica.muted = silencio;
    musica.volume = 0;
    musica.play().catch(() => {});
    fundir(musica, hablando ? VOL_CON_VOZ : VOL, 2500);
  }
  let audioPausado = false;
  function pausarAudio(si) {
    audioPausado = si;
    if (si) {
      if (musica) musica.pause();
      if (hablando) voz.pause();
    } else {
      if (musica && !musicaFinal && musica.currentTime > 0) musica.play().catch(() => {});
      if (hablando && voz.paused) voz.play().catch(() => terminarVoz());
    }
  }
  // Al empezar el video: si la canción se terminaría antes que el video, pasa (con un fundido, mientras
  // habla la voz) al punto justo para que el final de la canción llegue junto con el final del video,
  // en lugar de terminarse y volver a empezar.
  function alinearMusicaConVideo() {
    if (!musica || !conVideo) return;
    if (!isFinite(video.duration) || !isFinite(musica.duration)) {
      video.addEventListener("loadedmetadata", alinearMusicaConVideo, { once: true });
      return;
    }
    musica.loop = false;
    const fin = () => Math.min(A.finMusica ?? musica.duration, musica.duration);
    const faltaVideo = () => video.duration - video.currentTime;
    if (fin() - musica.currentTime >= faltaVideo()) return;   // alcanza hasta el final: sigue como está
    const vieja = musica, nueva = new Audio(A.musica);
    nueva.preload = "auto";
    nueva.muted = silencio;
    nueva.volume = 0;
    musica = nueva;
    nueva.addEventListener("loadedmetadata", () => {
      if (musica !== nueva) return;
      nueva.currentTime = Math.max(0, fin() - faltaVideo());
      if (audioPausado || musicaFinal) return vieja.pause();
      nueva.play().catch(() => {});
      fundir(nueva, hablando ? VOL_CON_VOZ : volBase, 1500);
      fundir(vieja, 0, 1500);
      setTimeout(() => vieja.pause(), 1600);
    }, { once: true });
  }

  if (conVideo) {
    video.addEventListener("ended", () => {
      musicaFinal = true;
      fundir(musica, 0, 4000);
      setTimeout(() => { if (musicaFinal && musica) musica.pause(); }, 4100);
    });
  }

  let fotoCargada = false;
  function mostrarFoto(si) {
    const f = $("foto");
    if (si && !fotoCargada && ig) {
      fotoCargada = true;
      const img = $("foto-img");
      img.onerror = () => f.classList.add("sin-foto");
      img.onload = () => f.classList.remove("sin-foto");
      img.src = ig.foto;
      // arriba en chico: iglesia y dirección; título grande: el de la foto (o el de la presentación)
      $("f-direccion").textContent = [ig.nombre, ig.direccion].filter(Boolean).join(" · ");
      $("f-nombre").textContent = ig.tituloFoto || P.titulo || "";
      $("f-texto").textContent = ig.cierre ? ig.cierre.texto : "";
      $("f-cita").textContent = ig.cierre ? ig.cierre.cita : "";
    }
    f.classList.toggle("visible", si);
    if (si) {
      volBase = VOL * (A.musicaEnVideo ?? 1);
      reproducirVideo();
      narrar(A.vozFinal);
      alinearMusicaConVideo();
    } else {
      if (conVideo) video.pause();
      if (musica) musica.loop = true;
    }
    $("rotulo").classList.toggle("oculto", si || escena < 0);
    $("marca").classList.toggle("oculto", si || escena < 0);
  }

  function mostrarCierre(si) {
    const e = escena >= 0 ? escenas[escena] : null;
    if (si && e && e.cierre) {
      $("c-texto").textContent = e.cierre.texto || "";
      $("c-cita").textContent = e.cierre.cita || "";
    }
    $("cierre").classList.toggle("oculto", !si);
  }

  // ── Línea de tiempo ───────────────────────────────────────
  function irA(i) {
    i = Math.max(0, Math.min(escenas.length - 1, i));
    escena = i;
    lugares.forEach((l) => { l.t = l.escena < i ? -99 : null; });
    indice = 0;
    etapa = 0;
    fase = "vuelo";
    mostrarCierre(false);
    mostrarFoto(false);
    mostrarEscena(i);
    actualizarContadores();
    if (escenas[i].acercamiento) volar(vistaDe(vistaKm(escenas[i].etapas[0].km)), true);
    else volar(vistaDe(escenas[i].vista));
    volBase = VOL;
    narrar(escenas[i].acercamiento ? escenas[i].etapas[0].voz : escenas[i].voz);
  }

  // Al empezar (con una tecla o un clic de la persona) se pide permiso de sonido para el video del final,
  // así el navegador no lo bloquea cuando aparece al terminar.
  function prepararSonido() {
    if (!conVideo || !video.paused) return;
    video.muted = false;
    const r = video.play();
    if (r && r.then) r.then(() => {
      if (!$("foto").classList.contains("visible")) { video.pause(); video.currentTime = 0; }
    }).catch(() => {});
  }

  // Enter / clic: arranca la música y la voz de la portada; el recorrido empieza cuando termina la voz
  function empezar() {
    if (fase === "intro") return arrancar();   // otro toque durante la frase: saltearla
    prepararSonido();
    arrancarMusica();
    if (A.vozPortada && fase === "portada") {
      narrar(A.vozPortada);
      fase = "intro";
      proximo = reloj + 0.6;
      reproducir(true);
      return;
    }
    arrancar();
  }

  function arrancar() {
    $("portada").classList.add("oculto");
    $("marca").classList.remove("oculto");
    $("rotulo").classList.remove("oculto");
    reproducir(true);
    irA(0);
  }

  function reiniciar() {
    reproducir(false);
    callar();
    if (musica) { fundir(musica, 0, 1200); setTimeout(() => { if (escena < 0) musica.pause(); }, 1300); }
    escena = -1; fase = "portada";
    lugares.forEach((l) => { l.t = null; });
    mostrarCierre(false);
    mostrarFoto(false);
    $("portada").classList.remove("oculto");
    $("marca").classList.add("oculto");
    $("rotulo").classList.add("oculto");
    actualizarContadores();
    volar(vistaDe(vistaActual()));
    regreso = true; // el vuelo de regreso corre aunque esté en pausa
  }

  function siguiente() {
    if (escena < 0) return fase === "intro" ? arrancar() : empezar();
    if (escena < escenas.length - 1) { reproducir(true); pausarAudio(false); irA(escena + 1); }
  }
  function anterior() {
    if (escena > 0) { reproducir(true); pausarAudio(false); irA(escena - 1); }
    else if (escena === 0) reiniciar();
  }

  let wakeLock = null;
  function reproducir(si) {
    reproduciendo = si;
    // (en los íconos SVG hay que usar el atributo: la propiedad .hidden no existe)
    $("b-play").querySelector(".i-play").toggleAttribute("hidden", si);
    $("b-play").querySelector(".i-pausa").toggleAttribute("hidden", !si);
    $("b-play").setAttribute("aria-label", si ? "Pausar (Espacio)" : "Reproducir (Espacio)");
    if (si && "wakeLock" in navigator && !wakeLock) {
      navigator.wakeLock.request("screen").then((w) => { wakeLock = w; w.addEventListener("release", () => { wakeLock = null; }); }).catch(() => {});
    }
    mostrarControles();
  }
  function alternar() {
    if (escena < 0 && fase !== "intro") return empezar();
    if (fase === "fin") {
      const pausar = conVideo ? !video.paused : !(musica && musica.paused);
      if (conVideo) { if (pausar) video.pause(); else video.play().catch(() => {}); }
      pausarAudio(pausar);
      return;
    }
    reproducir(!reproduciendo);
    pausarAudio(!reproduciendo);
  }

  function avanzar() {
    if (fase === "intro" && reloj >= proximo && vozLibre()) arrancar();
    if (vuelo) {
      const t = Math.min(1, (reloj - vuelo.t0) / vuelo.dur);
      cam = vuelo.interp(d3.easeCubicInOut(t));
      if (t >= 1) {
        vuelo = null; regreso = false;
        if (fase === "vuelo" && escenas[escena].acercamiento) {
          fase = "etapa";
          proximo = reloj + (escenas[escena].etapas[etapa].pausa || 1.5);
        } else if (fase === "vuelo") {
          fase = "luces";
          proximo = reloj + 0.5;
          if (escenas[escena].final) mostrarCierre(true);
        }
      }
    }
    if (fase === "luces" && reloj >= proximo) {
      const e = escenas[escena];
      const propios = lugares.filter((l) => l.escena === escena);
      if (indice < propios.length) {
        const l = propios[indice++];
        l.t = reloj;
        decidirEtiqueta(l);
        actualizarContadores();
        proximo += e.ritmo || P.segundosPorLuz || 0.55;
      } else {
        fase = "pausa";
        proximo = reloj + (e.final ? 0 : (e.pausa || 2.8));
      }
    }
    // Acercamiento: cada etapa un poco más cerca, y al final el destello y la foto
    if (fase === "etapa" && reloj >= proximo && vozLibre()) {
      const e = escenas[escena];
      etapa++;
      if (etapa < e.etapas.length) {
        mostrarRotulo(e.etapas[etapa].titulo, e.etapas[etapa].subtitulo, e.fuente);
        narrar(e.etapas[etapa].voz);
        fase = "vuelo";
        volar(vistaDe(vistaKm(e.etapas[etapa].km)), true);
      } else {
        etapa = e.etapas.length - 1;
        fase = "destello";
        tDestello = reloj;
        proximo = reloj + 1.25;
      }
    }
    if (fase === "destello" && reloj >= proximo) {
      mostrarFoto(true);
      fase = "fin";
      setTimeout(() => { if (fase === "fin") reproducir(false); }, 1800);
    }
    if (fase === "pausa" && reloj >= proximo && vozLibre()) {
      if (escena < escenas.length - 1) irA(escena + 1);
      else { fase = "fin"; reproducir(false); }
    }
  }

  function cuadro(ahora) {
    const dt = Math.min(0.1, (ahora - ultimo) / 1000);
    ultimo = ahora;
    if (reproduciendo || regreso) reloj += dt;
    avanzar();
    dibujarBase(ahora);
    dibujarLuces(ahora);
    requestAnimationFrame(cuadro);
  }

  // ── Controles ─────────────────────────────────────────────
  let temporizador = null;
  // Muestra el cursor al mover el mouse y lo vuelve a ocultar a los 2 segundos
  function mostrarControles() {
    escenario.classList.remove("sin-cursor");
    clearTimeout(temporizador);
    temporizador = setTimeout(() => escenario.classList.add("sin-cursor"), 2000);
  }

  function modoProyector(si) {
    proyector = si;
    try { localStorage.setItem("fdl-proyector", si ? "1" : "0"); } catch (e) { /* sin almacenamiento */ }
    $("b-proyector").setAttribute("aria-pressed", String(si));
    baseSucia = true;
  }
  $("b-proyector").setAttribute("aria-pressed", String(proyector));
  $("b-proyector").addEventListener("click", () => {
    modoProyector(!proyector);
  });

  const tactil = matchMedia("(pointer: coarse)").matches;
  const puedePantalla = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  if (!puedePantalla) $("b-pantalla").hidden = true;
  const sinError = (r) => { if (r && r.catch) r.catch(() => {}); return r; };

  function pantallaCompleta() {
    const d = document, el = d.documentElement;
    try {
      if (d.fullscreenElement || d.webkitFullscreenElement) {
        sinError((d.exitFullscreen || d.webkitExitFullscreen).call(d));
      } else {
        const r = sinError((el.requestFullscreen || el.webkitRequestFullscreen).call(el));
        // en el celular, intenta quedar apaisado (Android)
        if (tactil && r && r.then) r.then(() => sinError(screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape")));
      }
    } catch (e) { /* no disponible */ }
  }

  $("b-play").addEventListener("click", alternar);
  $("b-sig").addEventListener("click", siguiente);
  $("b-ant").addEventListener("click", anterior);
  $("b-reiniciar").addEventListener("click", reiniciar);
  $("b-pantalla").addEventListener("click", pantallaCompleta);
  window.addEventListener("pointermove", (ev) => { if (ev.pointerType === "mouse") mostrarControles(); });

  // Celular: un toque muestra los controles; deslizar cambia de escena
  let toque = null;
  escenario.addEventListener("pointerdown", (ev) => {
    mostrarControles();
    toque = ev.target.closest("button") ? null : { x: ev.clientX, y: ev.clientY };
  });
  escenario.addEventListener("pointerup", (ev) => {
    if (!toque) return;
    const dx = ev.clientX - toque.x, dy = ev.clientY - toque.y;
    toque = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) (dx < 0 ? siguiente : anterior)();
    else if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && escena < 0) empezar();   // clic o toque en la portada
  });

  window.addEventListener("keydown", (ev) => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const t = ev.key;
    if (t === " " || t === "Enter" || t === "k" || t === "K") {
      ev.preventDefault(); alternar();
    } else if (t === "ArrowRight" || t === "PageDown") { ev.preventDefault(); siguiente(); }
    else if (t === "ArrowLeft" || t === "PageUp") { ev.preventDefault(); anterior(); }
    else if (t === "r" || t === "R" || t === "Home") { ev.preventDefault(); reiniciar(); }
    else if (t === "f" || t === "F") { ev.preventDefault(); pantallaCompleta(); }
    else if (t === "p" || t === "P") { ev.preventDefault(); $("b-proyector").click(); }
    else if (t === "m" || t === "M") {
      ev.preventDefault();
      silencio = !silencio;
      if (musica) musica.muted = silencio;
      voz.muted = silencio;
      if (conVideo) {
        video.muted = silencio;
        // si el navegador frena el video al activar el sonido, sigue sin sonido
        if (video.paused && fase === "fin") video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
      }
    }
    else return;
    mostrarControles();
  });

  let pendiente = null, tamPrevio = innerWidth + "x" + innerHeight;
  window.addEventListener("resize", () => {
    clearTimeout(pendiente);
    pendiente = setTimeout(() => {
      const t = innerWidth + "x" + innerHeight;
      if (t !== tamPrevio) { tamPrevio = t; redimensionar(); }
    }, 180);
  });
  document.addEventListener("visibilitychange", () => { ultimo = performance.now(); });

  $("r-titulo").textContent = escenas[0].titulo || "";
  $("r-sub").textContent = escenas[0].subtitulo || "";
  $("r-fuente").textContent = escenas[0].fuente || "";
  redimensionar();
  actualizarContadores();
  requestAnimationFrame(cuadro);
})();
</script>
